  # within the last year.
  # Justification: Regular verification ensures that the benchmark remains functional as dependencies
  # and environments evolve, maintaining accessibility and reproducibility.
  # Scoring:
  # 0 (not checked)
  # 15 (checked within last year)
  code_usability_checked:
    score: null
    justification: "Explanation of how this criterion is met or not met"

  # Criterion: Maintained feedback channel for users is available
  # Explanation: The benchmark maintains an active feedback channel (e.g., GitHub Issues, email,
  # forum) for users to report issues or ask questions.
  # Justification: Maintaining a feedback channel enables community engagement, issue reporting, and
  # continuous improvement of the benchmark.
  # Scoring:
  # 0 (not available)
  # 15 (available and maintained)
  feedback_channel:
    score: null
    justification: "Explanation of how this criterion is met or not met"

  # Criterion: Contact person is listed
  # Explanation: The benchmark provides contact information for a person or team responsible for the benchmark.
  # Justification: Providing contact information enables users to reach out with questions, issues, or
