benchmark_info:
  name: "MLGym"
  version: "1.0"
  paradigm: "Process-Oriented"
  description: "Evaluates LLM agents on realistic, multi-step AI research tasks."
  reference: "https://openai.com/research/mlgym"

evaluation_engineering:
  design:
    construct_validity: "High. Measures multi-step agentic workflows, not just static knowledge."
    task_generation: "Procedural"
    adversarial_design: "Dynamic task generation limits memorization."
  implementation:
    data_versioning: "Git"
    reproducibility: "Docker"
    script_availability: "Public GitHub repository"
  maintenance:
    status: "Active"
    contamination_status: "Audited - No Contamination (private dataset)"
    feedback_channel: "GitHub Issues"

capability_assessment:
  static_knowledge:
    evaluates: false
    capability_measured: null
    task_format: null

  process_orientation:
    evaluates: true
    capability_measured: "Multi-step reasoning and tool use in a research workflow."
    workflow_stages:
      - stage_id: 1
        name: "Problem Definition & Scoping"
        description: "Agent must parse the request and define the problem space."
        metrics: ["scoping_accuracy"]
        
      - stage_id: 2
        name: "Experimentation & Tool Use"
        description: "Agent must run code, use tools, and analyze results."
        metrics: ["tool_selection_f1", "execution_success_rate"]
        
      - stage_id: 3
        name: "Synthesis & Reporting"
        description: "Agent must synthesize all findings into a final report."
        metrics: ["final_report_quality", "hallucination_rate"]

  learning_adaptability:
    evaluates: false
    capability_measured: null
    learning_type: null
    metrics: []