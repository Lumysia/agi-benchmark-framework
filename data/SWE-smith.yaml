benchmark_info:
  name: "SWE-smith"
  version: "1.0"
  description: "SWE-smith is a novel pipeline for generating software engineering training data at scale. Given any Python codebase, SWE-smith constructs a corresponding execution environment, then automatically synthesizes 100s to 1,000s of task instances that break existing test(s) in the codebase. Using SWE-smith, we create a dataset of 50k instances sourced from 128 GitHub repositories, with multiple bug generation strategies including LM generation, procedural modification, combining bugs, and PR mirroring."
  reference: "https://arxiv.org/abs/2504.21798"

design:
  tested_capability_definition:
    score: 15
    justification: "The Abstract explicitly defines the tested capability: 'generating software engineering training data' and 'training Language Model (LM) agents for software engineering tasks.' Section 1 states: 'building open source LMs for SE remains bottlenecked by the lack of large-scale, high-quality training data.' Section 2.1 describes how SWE-smith creates task instances that break existing tests, which tests the capability of models to fix software bugs and resolve GitHub issues."
  capability_to_task_translation:
    score: 15
    justification: "Section 2.1 comprehensively describes how capabilities translate to tasks: 'Creating task instance candidates. Per repository, we employ four different strategies to create candidates: (1) LM Generation - provide an LM with the function and prompt it to introduce errant modifications or rewrite functions, (2) Procedural Modification - randomly perform transformations on AST, (3) Combine Bugs - aggregate candidates from the same file(s) or module(s), (4) Invert PRs - undo PR revisions.' Section A.1 describes the task instance format with fields like patch, problem statement, FAIL TO PASS tests."
  real_world_relevance:
    score: 15
    justification: "Section 1 extensively describes real-world relevance: 'Language Model (LM) agents, such as SWE-agent or OpenHands, have made remarkable progress towards automating software engineering (SE) tasks, as tracked by benchmarks such as SWE-bench.' Section 1 explains the pain point: 'The procedures to curate such datasets are often complex, necessitating hundreds of hours of human labor; companion execution environments also take up several terabytes of storage.' Section 2.2 states: 'SWE-smith task instances span a broad range of difficulties, similar to SWE-bench and SWE-gym.'"
  use_cases_and_personas:
    score: 10
    justification: "Section 1 mentions: 'We train SWE-agent-LM-32B, achieving 40.2% Pass@1 resolve rate on the SWE-bench Verified benchmark' and 'We open source SWE-smith (collection procedure, task instances, trajectories, models) to lower the barrier of entry for research in LM systems for automated software engineering.' Section 3 describes training software engineering agents. However, specific user personas and interaction contexts are not explicitly detailed."
  domain_expert_involvement:
    score: 10
    justification: "The paper mentions manual verification steps: 'We then manually verify the installation and testing instructions' (Section 2.1) and 'The manual review process following this requires 3 to 20 minutes. One author carried out this effort for 128 repositories, taking an estimated 18 human hours to accomplish.' Section A.2 mentions ensuring repositories have licenses allowing non-proprietary use. However, it's not explicitly stated whether software engineering domain experts were co-authors or extensively involved in design decisions."
  domain_literature_integration:
    score: 15
    justification: "Section 5 'Related Work' extensively cites domain literature on LMs for Software Engineering (Yang et al., 2024a; Wang et al., 2024; Jimenez et al., 2024b), Training Datasets for Coding (Luo et al., 2023; Muennighoff et al., 2024; Pan et al., 2024; Jain et al., 2025), and SWE-bench benchmarks. Section 2.1 explicitly describes how insights from SWE-bench informed the design: 'Conceptually, this is a simple inversion of SWE-bench's approach, which instead prioritizes identifying task instances, and then attempts to build an environment for each.'"
  score_interpretation:
    score: 15
    justification: "Section 4 provides extensive analysis of what scores mean: Table 3 shows 'Resolve rates for existing solutions on SWE-bench Lite and Verified' and Section 4 explains that 'SWE-agent-LM-32B, achieves 40.2% (+33.4%) on SWE-bench Verified in a single attempt.' Section 4.1 describes ablations showing what different bug types and issue generation strategies mean. Section 4.2 analyzes agent behavior including failure modes and efficiency."
  informed_metric_choice:
    score: 15
    justification: "Section 3 explains evaluation metrics: 'We evaluate on the SWE-bench Lite and Verified (Chowdhury et al., 2024) subsets... We report the % resolved metric, the proportion of successfully resolved instances.' Section 4 provides detailed performance comparisons: 'All performance numbers are pass@1. We do not compare against systems that use verifiers or multiple attempts at test time.' Section F.4 explains Pass@k calculations and provides justification for the chosen metrics."
  metric_floors_ceilings:
    score: 10
    justification: "Section 4 provides baseline comparisons with other models (e.g., 'Qwen-2.5-Coder-Instruct 7B' baseline performance), and Section 2.2 mentions difficulty ratings comparable to SWE-bench. However, explicit floors (random performance) and ceilings are not uniformly provided for all metrics, though baseline model performances serve as reference points."
  human_performance_level:
    score: 0
    justification: "Human performance levels are not explicitly stated or measured for the benchmark tasks. The paper focuses on model-to-model comparisons and training effectiveness rather than human baselines."
  random_performance_level:
    score: 0
    justification: "Random performance baselines are not explicitly stated for the benchmark tasks, though the paper presents baseline model performance before training."
  input_sensitivity:
    score: 0
    justification: "Input sensitivity is not mentioned or addressed in the paper. The benchmark uses fixed prompts and strategies for bug generation but does not test variations in inputs."
  validated_automatic_evaluation:
    score: 15
    justification: "Section A.3 states: 'We adapt SWE-bench's validation script to convert each bug patch into a SWE-bench style task instance. This step ensures SWE-smith can be run by existing SWE-bench solutions.' Section 2.1 describes 'Execution-based validation of candidates. We apply each candidate patch to the corresponding repository, run the test suite, and only keep patches that break one or more existing, passing tests.' The evaluation is fully automated using unit tests."
  differences_to_related_benchmarks:
    score: 15
    justification: "Section 2 extensively explains differences to SWE-bench: 'SWE-smith's collection strategy is to define an execution environment first, and then synthesize task instances within the environment. Conceptually, this is a simple inversion of SWE-bench's approach.' Table 2 compares SWE-smith to other datasets. Section 2.1 states: 'SWE-smith removes the need for manual efforts to determine installation specifications for multiple versions of a codebase across time, the most costly step of SWE-bench collection.' Section C.2 provides detailed comparison with SWE-bench methodology."

implementation:
  evaluation_code_available:
    score: 15
    justification: "Section 1 states: 'All assets available at https://swesmith.com.' Section 1 also mentions: 'We open source SWE-smith (collection procedure, task instances, trajectories, models) to lower the barrier of entry for research in LM systems for automated software engineering.' Section A.3 states: 'We adapt SWE-bench's validation script to convert each bug patch into a SWE-bench style task instance. This step ensures SWE-smith can be run by existing SWE-bench solutions.'"
  replication_script:
    score: 15
    justification: "Section 2.1 comprehensively describes the collection procedure with detailed steps. Section A provides infrastructure details including task instance format, repository selection, and validation/evaluation harnesses. Section F.1 describes training details: 'Training and hyperparameter details are in §F.1' and provides comprehensive implementation details including rejection sampling fine-tuning setup, SWE-agent configuration, and evaluation metrics."
  evaluation_data_accessible:
    score: 15
    justification: "Section 1 states the dataset is available at https://swesmith.com. Section 1 mentions: 'We open source SWE-smith (collection procedure, task instances, trajectories, models).' Section 2.1 describes: 'Using SWE-smith, we create a dataset of 50k task instances across 128 real-world GitHub repositories.' The paper explicitly states that all assets are publicly available."
  api_evaluation_support:
    score: 10
    justification: "Section 3 mentions using API-based models as experts: 'For expert models, we use claude-3-7-sonnet-20250219 (Anthropic, 2025)... we also use claude-3-5-sonnet-20240620 and gpt-4o-2024-08-06.' Section F.1 describes using SWE-agent with API models. However, it's not explicitly stated that the benchmark supports general API evaluation for users beyond the research described."
  local_model_evaluation_support:
    score: 15
    justification: "Section 3 describes evaluating both API-based models (as experts) and local models: 'We use the Qwen-2.5-Coder-Instruct (Hui et al., 2024) 7B and 32B series as the base models.' Section F.1 describes: 'For running inference with student models, we run with a maximum of 75 steps or a cost limit of $2.00.' The code implementation supports local model evaluation as demonstrated by training SWE-agent-LM-7B and SWE-agent-LM-32B."
  guid_or_encryption:
    score: 0
    justification: "No mention of GUID (Globally Unique Identifier) or canary strings, or encryption of evaluation data files to prevent contamination. The paper discusses data collection from real repositories but does not implement contamination prevention measures."
  training_on_test_set_task:
    score: 0
    justification: "No task included to identify if the model was trained on the benchmark data. The paper discusses training on SWE-smith itself but does not implement a detection mechanism for contamination."
  sensitive_content_warnings:
    score: 0
    justification: "No explicit statement in the paper about whether tasks or outputs contain sensitive/harmful content. The benchmark focuses on software engineering tasks and code bugs, but potential sensitive content warnings are not addressed."
  release_requirements:
    score: 0
    justification: "Release requirements or terms of use for benchmark users are not specified in the paper."
  build_status:
    score: 0
    justification: "Build status or continuous integration is not mentioned in the paper."
  requirements_file:
    score: 10
    justification: "The website https://swesmith.com likely contains requirements or setup instructions, but this is not explicitly mentioned in the paper. Section F.1 mentions training using 'torchtune (PyTorch, 2024) library' and 'Unsloth (Daniel Han & team, 2023) library' but doesn't detail user-facing requirements files."
  quick_start_guide:
    score: 10
    justification: "The website https://swesmith.com may contain a README or quick-start guide, but this is not explicitly described in the paper. Section 2.1 provides a high-level workflow overview but doesn't describe user-facing setup documentation."
  statistical_significance:
    score: 10
    justification: "Section 4.1 shows some standard deviations in tables (e.g., '5.7 (±1.5)', '8.8 (±1.7)') for certain experiments, and Section F.4 mentions running evaluations multiple times. However, comprehensive statistical significance testing is not consistently reported across all results."

documentation:
  inline_code_comments:
    score: 5
    justification: "Code comments are not mentioned in the paper. The code is available at https://swesmith.com but documentation quality of the code itself is not addressed."
  code_documentation:
    score: 5
    justification: "Code documentation is not explicitly mentioned. The website https://swesmith.com likely has some documentation, but this is not described in the paper."
  peer_reviewed_venue:
    score: 0
    justification: "The paper is marked as 'arXiv:2504.21798v2 [cs.SE] 21 May 2025' and does not indicate acceptance at a peer-reviewed venue. It appears to be a preprint."
  construction_process_documented:
    score: 15
    justification: "Section 2.1 'Collection' comprehensively documents the construction process: 'Building execution environments for repositories with passing tests', 'Creating task instance candidates', 'Execution-based validation of candidates', and 'Generating problem statements.' Section A provides detailed infrastructure documentation. Section B documents all bug generation strategies in depth."
  test_tasks_rationale_documented:
    score: 15
    justification: "Section 2.1 documents each task generation strategy and rationale: 'LM Generation: Per repository, we identify all programmatic entities (functions, classes)...', 'Procedural Modification: Per function, we acquire an abstract syntax tree (AST) representation...', 'Combine Bugs: ...we devise a Patch Combination strategy...', 'Invert PRs (or PR Mirror): Per repository, we collect all PRs that modify Python files.' Each strategy's purpose is explained."
  normative_properties_documented:
    score: 10
    justification: "Section 3 describes assumptions about models and evaluation: 'For expert models, we use claude-3-7-sonnet-20250219... We use the Qwen-2.5-Coder-Instruct... series as the base models.' Section A.2 describes repository selection criteria. However, explicit normative assumptions about models or evaluation context are not comprehensively documented."
  limitations_documented:
    score: 15
    justification: "Section 6 'Discussion' extensively documents limitations: 'First, SWE-smith's collection pipeline is Python-centric. The mechanisms to identify programmatic objects (e.g. functions, classes) and perform transformations rely heavily on the Python specific ast library.' 'Second, due to both compute/budget constraints and our work's primary stance as a dataset contribution, we only include fine-tuning as a demonstration of SWE-smith's effectiveness.' Section C.2 discusses limitations compared to SWE-bench evaluation suitability."
  data_collection_documented:
    score: 15
    justification: "Section 2.1 comprehensively documents data collection: 'We target repositories for the 5,000 most downloaded packages listed in the Python Package Index (PyPI) as of November 18, 2024, sort the PyPI packages by GitHub stars, and then remove any PyPI package with less than 1,000 stars, as well as all 12 SWE-bench test repositories from consideration.' Section A.2 documents repository selection criteria and license requirements. Section B documents each bug generation strategy in detail."
  evaluation_metric_documented:
    score: 15
    justification: "Section 3 provides comprehensive documentation of evaluation metrics: 'We evaluate on the SWE-bench Lite and Verified (Chowdhury et al., 2024) subsets... We report the % resolved metric, the proportion of successfully resolved instances.' Section F.1 explains: 'To evaluate the resilience of safety alignment models from diverse training backgrounds and strategies.' Section 4 provides detailed performance metrics and comparisons."
  license_specified:
    score: 15
    justification: "Section A.2 'Repository Selection' states: 'we also ensure that a repository has a license that allows non-proprietary use. The majority of software licenses are permissive (BSD, MIT, Apache), while the remainder are largely protective licenses (GPL) that still allow for non-commercial use.' Table 6 provides a comprehensive list of licenses for each repository. However, the license for SWE-smith itself (the benchmark toolkit) is not explicitly stated in the paper, though it's described as open-source."
  persistent_identifier:
    score: 10
    justification: "The paper provides an arXiv identifier (arXiv:2504.21798v2) for the paper itself, and mentions the website https://swesmith.com. However, no DOI or persistent identifier is mentioned for the dataset specifically."
  standardized_metadata:
    score: 5
    justification: "Section A.1 describes the task instance format with specific fields (repo, instance id, base commit, patch, problem statement, created at, FAIL TO PASS, PASS TO PASS), but it's not explicitly stated that this follows a recognized metadata standard like Schema.org or Dublin Core."
  data_sources_documented:
    score: 15
    justification: "Section 2.1 comprehensively documents data sources: 'We target repositories for the 5,000 most downloaded packages listed in the Python Package Index (PyPI) as of November 18, 2024, sort the PyPI packages by GitHub stars, and then remove any PyPI package with less than 1,000 stars.' Section A.2 provides detailed license information. Section C provides repository categorization. Section B documents source code origins for bug generation strategies."
  data_preprocessing_documented:
    score: 15
    justification: "Section 2.1 documents preprocessing: 'Execution-based validation of candidates. We apply each candidate patch to the corresponding repository, run the test suite, and only keep patches that break one or more existing, passing tests... For efficiency purposes, we also limit testing runtime to two minutes.' Section A.3 describes validation: 'The conversion involves two steps. First, the bug patch is applied and pushed as a branch to a mirror clone of the repository. Second, we create a SWE-bench style task instance from the bug patch.' Section D documents issue generation preprocessing."
  data_annotation_documented:
    score: 10
    justification: "Section 2.1 mentions: 'The steps requiring manual effort are (1) parsing the correct installation setup procedures from the agent trajectory (∼ 7 min per repository), and (2) implementing the parser for test outputs (∼ 1 min per repository).' Section D documents issue generation which involves LM-generated annotations. However, comprehensive annotation process documentation including annotator instructions is not extensively provided, as the process is largely automated."
  data_representativeness_explained:
    score: 15
    justification: "Section 2.1 explains the selection criteria: 'We target repositories for the 5,000 most downloaded packages listed in the Python Package Index (PyPI)... sort the PyPI packages by GitHub stars, and then remove any PyPI package with less than 1,000 stars.' Section 2.2 explains: 'SWE-smith task instances span a broad range of difficulties, similar to SWE-bench and SWE-gym. The average difficulty score for SWE-smith (5.27–5.72 across bug generation strategies) is comparable to SWE-bench (5.01).' Section C provides extensive dataset statistics and analysis."
  documentation_standard:
    score: 0
    justification: "The documentation does not explicitly follow recognized standards like Datasheets for Datasets or Model Cards."

