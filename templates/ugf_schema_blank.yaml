  # Scoring:
  # 0 (not provided)
  # 5 (partial, e.g., DOI for paper only)
  # 10 (provided for some components)
  # 15 (provided for dataset and metadata)
  persistent_identifier:
    score: null 
    justification: "Explanation of how this criterion is met or not met"

  # Criterion: Standardized metadata is included
  # Explanation: The benchmark includes standardized metadata following recognized schemas or formats.
  # Justification: Standardized metadata improves interoperability, discoverability, and enables automated
  # processing and integration with other systems.
  # Scoring:
  # 0 (not included)
  # 15 (included following recognized standard)
  standardized_metadata:
    score: null
    justification: "Explanation of how this criterion is met or not met"

  # Criterion: Data sources and how the data was collected is documented
