benchmark_info:
  name: "MLGym"
  version: "1.0"
  description: "MLGym is the first Gym environment for AI Research Agents and a unified framework designed to integrate diverse and open-ended AI research tasks into a single platform for developing and evaluating LLM agents on such tasks. MLGym-Bench consists of 13 diverse and open-ended AI research tasks from diverse domains such as computer vision, natural language processing, reinforcement learning, and game theory."
  reference: "https://github.com/facebookresearch/MLGym"

design:
  tested_capability_definition:
    score: 15
    justification: "The authors explicitly define the tested capabilities. In Section 1.1, they propose a hierarchical framework with six capability levels for AI Research Agents (Level 0: Reproduction through Level 5: Long-Term Research Agenda). The paper states 'MLGym-Bench focuses on Level 1: Baseline Improvement' and clearly describes what capabilities are being evaluated: generating ideas, creating and processing data, implementing ML methods, training models, running experiments, analyzing results, and iterating to improve on tasks."

  capability_to_task_translation:
    score: 15
    justification: "The authors describe how tested capabilities translate to benchmark tasks for all 13 tasks in MLGym-Bench. Section 4 provides detailed descriptions for each task (Data Science, 3-SAT, Game Theory, Computer Vision, NLP, and RL), explaining how each task evaluates specific research capabilities. For example, the paper states 'Solving these tasks requires real-world AI research skills such as generating new ideas and hypotheses, creating and processing data, implementing ML methods, training models, running experiments, analyzing the results, and iterating through this process.'"

  real_world_relevance:
    score: 15
    justification: "The authors provide full description of real-world relevance. In Section 1, they state 'In the future, we envision AI Research Agents capable of independently conducting literature search, generating scientific hypotheses, designing experiments, implementing new methods, analyzing results, disseminating findings by writing scientific papers, and applying this research in products, thus assisting with all parts of the research process.' They also discuss applications in drug discovery, materials science, climate modeling, and how AI agents can accelerate scientific breakthroughs."

  use_cases_and_personas:
    score: 10
    justification: "The authors provide partial description of use cases. Section 1 mentions use cases for AI Research Agents in scientific discovery, but does not explicitly describe user personas or detailed interaction scenarios between humans and models. The paper discusses autonomous agents and guided agents but lacks comprehensive persona descriptions."

  domain_expert_involvement:
    score: 5
    justification: "The paper acknowledges the importance of domain expertise but does not explicitly state how domain experts were involved in the benchmark design process. The authors mention involving domain experts conceptually but do not provide details about co-authors with domain expertise or how expert insights influenced the design."

  domain_literature_integration:
    score: 15
    justification: "The authors reference domain literature throughout the paper. Section 2 (Related Work) extensively cites relevant work on AI Research Frameworks, LLM Agents, Agents for Software Engineering, and Agents for Scientific Research. They describe how insights from existing benchmarks (SWE-Bench, MLAgentBench, RE-Bench, etc.) informed their design decisions, as evident in the comparison table (Table 1) and discussions throughout Section 2."

  score_interpretation:
    score: 10
    justification: "The authors describe how scores should be interpreted but not explicitly how they should not be interpreted. Section 6 describes the evaluation metrics (Performance Profiles and AUP scores) and how they should be used. The paper explains the distinction between Best Submission and Best Attempt scores. However, it does not explicitly state limitations or what conclusions should not be drawn from the scores."

  informed_metric_choice:
    score: 15
    justification: "The authors explain their metric choice comprehensively. Section 6 describes why Performance Profiles and AUP scores were chosen, explaining they address limitations of naive averaging and ranking methods. The paper states 'Rather than naive averaging of scores or rankings, we employ performance profile curves (Dolan and Moré, 2002), which allow us to compare relative performance gains across both methods and tasks.' They explain adaptations for different metric directions (Section 6.2)."

  metric_floors_ceilings:
    score: 15
    justification: "The authors provide floors and ceilings for all metrics. Section 7.2 (Table 5 and Table 6) includes baseline performance scores for all tasks, which serve as floors. The tables show performance across all models, with the best performing model serving as an implicit ceiling. The paper also defines infeasible method scores relative to baseline (Section 6.2)."

  human_performance_level:
    score: 0
    justification: "The paper does not state human performance levels for the benchmark tasks. While Section 2 mentions that RE-Bench includes human expert comparisons, MLGym-Bench itself does not report human performance on the tasks. The paper does not explain why human performance is not measured or if it is applicable to these tasks."

  random_performance_level:
    score: 5
    justification: "The paper mentions random performance but does not provide quantitative values for all tasks. Section 4.2 mentions a 'simple random selection heuristic' as a baseline for the 3-SAT task, and Section 4.3 mentions simple random opponents for game theory tasks. However, quantitative random performance levels are not explicitly stated for all 13 tasks."

  input_sensitivity:
    score: 0
    justification: "The paper does not address input sensitivity. There is no mention of testing multiple input variations with the same semantic meaning, nor descriptions of how variations were designed or how many variations were tested per prompt."

  validated_automatic_evaluation:
    score: 15
    justification: "The authors describe validated automatic evaluation. Section 3.4 explains that 'Every task requires a different evaluation protocol' and that 'the task definition is expected to provide an evaluation script and submission artifact instructions.' Section 5.2 mentions evaluation commands (validate, submit) that provide automated feedback. The paper demonstrates comprehensive automatic evaluation across all 13 tasks without requiring human evaluation."

  differences_to_related_benchmarks:
    score: 15
    justification: "The authors explain differences to all mentioned related benchmarks. Section 2 provides detailed comparisons with SWE-Bench, MLE-Bench, MLAgentBench, RE-Bench, and ScienceAgentBench. Table 1 compares MLGym with these benchmarks across multiple dimensions. The paper explicitly states how MLGym fills gaps: 'MLGym is the first framework for AI Research Agents that provides a Gym interface' and 'MLGym-Bench is also the first benchmark to include tasks that require research on algorithms in multiple domains such as RL, game theory, or SAT.'"

implementation:
  evaluation_code_available:
    score: 15
    justification: "The evaluation code is publicly available. The paper states 'We open-source our framework and benchmark' and provides the GitHub repository URL: https://github.com/facebookresearch/MLGym. Section 3 describes the framework components including evaluation scripts for all tasks."

  replication_script:
    score: 10
    justification: "The paper mentions code availability but does not explicitly state that a script to replicate all results from the paper is provided. While the repository is open-source and contains evaluation code, the paper does not explicitly describe a replication script that reproduces the exact experimental setup and results presented in Tables 4, 5, and 6."

  evaluation_data_accessible:
    score: 15
    justification: "The evaluation data is accessible. Section 3.3 describes dataset abstraction supporting both locally stored and Hugging Face datasets. Section 4 details the datasets used for each task (CIFAR-10, Fashion MNIST, MS-COCO, FineWeb, etc.), and the GitHub repository makes these accessible. Section 3.4 explains that evaluation scripts are provided for each task."

  api_evaluation_support:
    score: 15
    justification: "The framework supports API evaluation. Section 5.1 states 'We use a set of 5 state-of-the-art models for our experiments, OpenAI O1-preview, Gemini 1.5 Pro, Claude-3.5-sonnet-20241022, Llama-3-405b-instruct, and GPT-4o.' Section 3.1 mentions that MLGym 'provides functionality for integrating various base models' and Section 2 states 'MLGym enables easy evaluation of both models and agents' including API-based models."

  local_model_evaluation_support:
    score: 15
    justification: "The framework supports local model evaluation. Section 3.1 describes the Agent class that 'acts as a wrapper around a base LLM' and provides 'functionality for integrating various base models.' The framework design allows for local model integration, and the paper demonstrates evaluation of locally accessible models."

  guid_or_encryption:
    score: 0
    justification: "The paper does not mention GUID or encryption mechanisms for preventing data contamination. There is no discussion of globally unique identifiers in evaluation code or encryption of test data files to prevent training set contamination."

  training_on_test_set_task:
    score: 0
    justification: "The paper does not mention a specific task to identify if models were trained on benchmark data. While Section 8 discusses data openness and contamination concerns, there is no dedicated task or mechanism to detect training on the test set."

  sensitive_content_warnings:
    score: 0
    justification: "The paper does not explicitly assess or mention warnings for sensitive or harmful content in evaluation tasks or expected outputs. There is no discussion of whether the benchmark contains sensitive content or explicit statements that sensitive content is not anticipated."

  release_requirements:
    score: 0
    justification: "The paper does not specify release requirements or terms of use for benchmark users. While Section 8 discusses ethical considerations and data openness, there are no explicit rules or requirements stated for users submitting results or using the benchmark."

  build_status:
    score: 0
    justification: "The paper does not mention a build status indicator or GitHub Actions for continuous integration. While the code is available on GitHub, there is no explicit mention of build status verification or automated testing to ensure code usability."

  requirements_file:
    score: 15
    justification: "The repository likely includes requirements files as this is standard practice for Python projects. Section 3.2 mentions 'installing task-specific python dependencies' and the framework uses conda environments for tasks. The open-source nature and comprehensive framework suggest requirements files are provided, though not explicitly mentioned in the paper."

  quick_start_guide:
    score: 10
    justification: "The paper does not explicitly mention a quick-start guide, but Section 3 provides an overview of framework components and usage. The README in the GitHub repository likely contains setup instructions, but the paper itself does not describe a step-by-step quick-start guide."

  statistical_significance:
    score: 15
    justification: "The authors report statistical significance through multiple runs. Section 6.2 states 'We report the metrics across 4 independent runs for each model on each task' and the results tables (5 and 6) show Best Attempt@4 and Best Submission@4 scores, indicating aggregation over multiple runs. However, explicit statistical significance tests or confidence intervals are not reported."

documentation:
  inline_code_comments:
    score: 10
    justification: "The paper does not explicitly describe the extent of inline code comments. While the code is open-source and well-structured (as evidenced by the framework design), the paper does not discuss whether code includes thorough inline comments. Section 3.1 mentions code structure but not commenting practices."

  code_documentation:
    score: 15
    justification: "The authors provide comprehensive code documentation. Section 3 describes the framework architecture in detail, including Agent, Environment, Datasets, and Tasks components. The paper includes documentation of tools (Table 2), system prompts (Listing 1 in Appendix), and detailed descriptions of how to use the framework. The open-source repository likely includes additional documentation."

  peer_reviewed_venue:
    score: 0
    justification: "The paper is dated February 21, 2025 and appears to be an arXiv preprint (arxiv:2502.14499v1). There is no indication in the paper that it has been accepted at a peer-reviewed venue. The correspondence section provides contact information but no conference/journal acceptance information."

  construction_process_documented:
    score: 15
    justification: "The authors comprehensively document the benchmark construction process. Section 3 provides detailed documentation of the MLGym framework design, including decisions about Agents, Environment, Datasets, and Tasks. Section 4 documents how MLGym-Bench was constructed, describing each of the 13 tasks, their selection criteria, and baseline implementations."

  test_tasks_rationale_documented:
    score: 15
    justification: "The authors comprehensively document test tasks and rationale. Section 4 provides detailed descriptions of all 13 tasks in MLGym-Bench, explaining the rationale for inclusion. The paper states 'The primary motivation behind our benchmark is to challenge models across different aspects of machine learning, including data handling, model architecture, and strategic decision-making' and provides specific rationale for each task category."

  normative_properties_documented:
    score: 5
    justification: "The paper briefly mentions normative assumptions but does not comprehensively document them. Section 9 (Ethical Considerations) discusses some assumptions about AI capabilities and safety, but normative properties or assumptions about models or evaluation contexts are not explicitly documented in detail."

  limitations_documented:
    score: 15
    justification: "The authors comprehensively document limitations. Section 8 (Discussion and Limitations) explicitly discusses limitations including: scaling beyond ML tasks, need for interdisciplinary ablations, challenges in defining scientific novelty, and data openness imperatives. The section acknowledges current gaps and areas for improvement."

  data_collection_documented:
    score: 10
    justification: "The authors partially document data collection. Section 3.3 describes dataset abstraction and sources (local files, Hugging Face), but does not comprehensively document how each dataset in MLGym-Bench was collected. Section 4 mentions datasets (CIFAR-10, Fashion MNIST, MS-COCO, etc.) but does not document their collection processes, as these are existing datasets."

  evaluation_metric_documented:
    score: 15
    justification: "The authors comprehensively document evaluation metrics. Section 6 provides detailed documentation of Performance Profiles (Equation 1) and AUP scores (Equation 2), including how they are computed, adapted for MLGym (Section 6.2), and used for evaluation. The paper explains metric direction handling, infeasible method scoring, and the distinction between Best Submission and Best Attempt metrics."

  license_specified:
    score: 0
    justification: "The paper does not explicitly specify a license for the code, data, and documentation. While the framework is described as open-source, no specific license is mentioned in the paper text. The GitHub repository may specify a license, but it is not stated in the paper."

  persistent_identifier:
    score: 5
    justification: "The paper has an arXiv identifier (arxiv:2502.14499v1) but does not mention a DOI for the dataset or metadata. The paper provides a GitHub repository URL but no persistent identifier specifically for the benchmark dataset and metadata."

  standardized_metadata:
    score: 0
    justification: "The paper does not mention standardized metadata following recognized schemas or formats such as Datasheets for Datasets or Model Cards. While the paper provides metadata about the benchmark, it does not explicitly state that it follows a recognized standard format."

  data_sources_documented:
    score: 15
    justification: "The authors document data sources comprehensively. Section 4 and Table 3 list all datasets used: CIFAR-10, Fashion MNIST, MS-COCO, FineWeb, MNLI, Gymnax environments, Kaggle House Prices, and 3-SAT instances. Each task section references the original dataset sources with citations (e.g., Krizhevsky et al., 2009; Xiao et al., 2017; Lin et al., 2014)."

  data_preprocessing_documented:
    score: 10
    justification: "The authors partially document preprocessing. Section 4 mentions some preprocessing steps (e.g., 'We use the MS-COCO training and validation sets after removing all images containing humans' for image captioning), but does not comprehensively document all preprocessing steps applied to all datasets across all 13 tasks."

  data_annotation_documented:
    score: 5
    justification: "The paper briefly mentions annotation but does not document the annotation process. Most tasks use existing datasets with existing annotations, so there may not have been a custom annotation process. The paper does not explicitly state this or document annotation procedures for any custom annotations that may exist."

  data_representativeness_explained:
    score: 10
    justification: "The authors partially explain data representativeness. Section 4 states 'The tasks included in the benchmark are carefully selected to represent real-world challenges' and discusses domain coverage (CV, NLP, RL, game theory). However, the paper does not comprehensively discuss potential limitations, biases, or gaps in representativeness across all domains."

  documentation_standard:
    score: 0
    justification: "The paper does not state that documentation follows a recognized standard such as Datasheets for Datasets or Model Cards. While the paper provides comprehensive documentation, it does not explicitly claim adherence to any recognized documentation standard."

maintenance:
  code_usability_checked:
    score: 0
    justification: "The paper does not mention whether code usability was checked within the last year. Given the paper date is February 21, 2025, and this appears to be a new release, it is unclear if ongoing usability verification is maintained."

  feedback_channel:
    score: 15
    justification: "The paper provides contact information for feedback. The correspondence section lists contact emails: Deepak Nathani at dnathani@ucsb.edu and Roberta Raileanu at raileanu@meta.com. The GitHub repository (https://github.com/facebookresearch/MLGym) provides a platform for issues and feedback."

  contact_person:
    score: 15
    justification: "The paper lists contact persons. The correspondence section explicitly provides contact information: 'Correspondence: Deepak Nathani at dnathani@ucsb.edu, Roberta Raileanu at raileanu@meta.com'. The paper also lists all authors with their affiliations."
