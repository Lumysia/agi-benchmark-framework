  # 15 (comprehensively documented including annotator instructions)
  data_annotation_documented:
    score: null 
    justification: "Explanation of how this criterion is met or not met"

  # Criterion: Representativeness of the data is explained (if applicable)
  # Explanation: The benchmark developers explain how representative the data is and discuss potential
